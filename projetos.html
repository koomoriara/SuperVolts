<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projetos - Super Volts Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/responsivo.css" rel="stylesheet"></head>
<body><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="brand"><img class="brand-logo" src="assets/imagens/logo-super-voltz.png" alt="Logo Super Volts" width="48" height="48"><div class="brand-text"><strong>SUPER VOLTS</strong><span>GESTÃO</span></div></div>
<nav class="sidebar-nav"><a href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a><a class="active" href="projetos.html"><i class="bi bi-house-gear-fill"></i> Projetos</a><a href="clientes.html"><i class="bi bi-person-vcard-fill"></i> Clientes</a><a href="estoque.html"><i class="bi bi-box-seam-fill"></i> Estoque</a><a href="equipes.html"><i class="bi bi-people-fill"></i> Equipes</a><a href="financeiro.html"><i class="bi bi-cash-stack"></i> Financeiro</a><a href="relatorios.html"><i class="bi bi-bar-chart-fill"></i> Relatórios</a><a href="configuracoes.html"><i class="bi bi-gear-fill"></i> Configurações</a></nav>
<div class="sidebar-footer"><a class="icon-button text-white" href="#" id="sair"><i class="bi bi-box-arrow-right"></i> Sair</a></div></aside><div class="overlay" id="overlay"></div>
<main class="main-area"><header class="topbar"><div class="topbar-title"><button class="menu-toggle" id="menuToggle"><i class="bi bi-list"></i></button><h1>Projetos</h1></div><div class="topbar-actions"><a class="icon-button" href="configuracoes.html" aria-label="Configurações"><i class="bi bi-gear"></i></a><div class="profile"><div class="profile-avatar"><i class="bi bi-person-fill"></i></div><div class="profile-meta"><strong id="nomeUsuario"></strong><small id="tipoUsuario"></small></div></div></div></header>
<section class="content"><section class="page-hero"><div class="page-hero-copy"><h2>SUPER VOLTS<br>PROJETOS</h2><p>Acompanhe os resultados e projetos da empresa em um só lugar.</p></div></section><div class="page-heading"><h2>Projetos</h2><button class="btn-primary-custom" id="novoProjeto" data-bs-toggle="modal" data-bs-target="#modalProjeto"><i class="bi bi-plus-lg"></i> Cadastrar projeto</button></div>
<div class="panel mb-3"><div class="row g-2"><div class="col-md-4"><input class="form-control" id="buscaProjeto" placeholder="Código ou observação"></div><div class="col-md-3"><select class="form-select" id="filtroClienteProjeto"><option value="">Todos os clientes</option></select></div><div class="col-md-3"><select class="form-select" id="filtroSituacaoProjeto"><option value="">Todas as situações</option><option>Não iniciado</option><option>Em andamento</option><option>Aguardando documentação</option><option>Aguardando homologação</option><option>Aguardando equipamentos</option><option>Aguardando instalação</option><option>Concluído</option><option>Cancelado</option></select></div><div class="col-md-2"><input class="form-control" type="date" id="filtroDataProjeto"></div></div></div>
<div class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Código</th><th>Cliente</th><th>Contrato</th><th>Situação</th><th>Previsão</th><th>Ações</th></tr></thead><tbody id="listaProjetos"></tbody></table></div></div></section></main></div>
<div class="modal fade" id="modalProjeto" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" id="formProjeto"><div class="modal-header"><h5>Dados do projeto</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="projetoId"><div class="row g-3">
<div class="col-md-4"><label class="form-label">Código</label><input class="form-control" id="projetoCodigo" required></div><div class="col-md-8"><label class="form-label">Cliente</label><select class="form-select" id="projetoCliente" required></select></div>
<div class="col-md-4"><label class="form-label">Potência do sistema (kWp)</label><input class="form-control" type="number" min="0" step="0.01" id="projetoPotencia" required></div><div class="col-md-4"><label class="form-label">Custo por kWp (R$)</label><input class="form-control" type="number" min="0" step="0.01" id="projetoCustoKwp" value="3000" required></div><div class="col-md-4"><label class="form-label">Margem de lucro (%)</label><input class="form-control" type="number" min="0" max="100" step="0.1" id="projetoMargem" value="30" required></div>
<div class="col-md-4"><label class="form-label">Custo estimado (R$)</label><input class="form-control" type="text" id="projetoCustoEstimado" readonly></div><div class="col-md-4"><label class="form-label">Lucro previsto (R$)</label><input class="form-control" type="text" id="projetoLucro" readonly></div><div class="col-md-4"><label class="form-label">Valor do contrato</label><input class="form-control" type="number" min="0" step="0.01" id="projetoValor" required readonly></div>
<div class="col-md-4"><label class="form-label">Consumo do cliente (kWh/mês)</label><input class="form-control" type="text" id="projetoConsumoCliente" readonly></div><div class="col-md-4"><label class="form-label">Economia mensal estimada</label><input class="form-control" type="text" id="projetoEconomia" readonly></div><div class="col-md-4"><label class="form-label">Data contratação</label><input class="form-control" type="date" id="projetoContratacao" required></div>
<div class="col-md-6"><label class="form-label">Previsão de conclusão</label><input class="form-control" type="date" id="projetoPrevista" required></div>
<div class="col-md-6"><label class="form-label">Responsável</label><input class="form-control" id="projetoResponsavel" required></div><div class="col-md-6"><label class="form-label">Situação</label><select class="form-select" id="projetoSituacao"><option>Não iniciado</option><option>Em andamento</option><option>Aguardando documentação</option><option>Aguardando homologação</option><option>Aguardando equipamentos</option><option>Aguardando instalação</option><option>Concluído</option><option>Cancelado</option></select></div>
<div class="col-md-6"><label class="form-label">Data real de conclusão</label><input class="form-control" type="date" id="projetoConclusao"></div><div class="col-md-6"><label class="form-label">Observações</label><input class="form-control" id="projetoObservacoes"></div>
</div></div><div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn-primary-custom" type="submit">Salvar</button></div></form></div></div>
<div class="modal fade" id="modalDetalhes" tabindex="-1"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header"><h5 id="tituloDetalhes">Detalhes do projeto</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body" id="conteudoDetalhes"></div></div></div></div>
<div class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js?v=20261120c"></script><script src="js/projetos.js?v=20261120"></script></body></html>
