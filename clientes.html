<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - Super Volts Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet"><link href="css/responsivo.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img class="brand-logo" src="assets/imagens/logo-super-voltz.png" alt="Logo Super Volts" width="50" height="48"><div class="brand-text"><strong>SUPER VOLTS</strong><span>GESTÃO</span></div></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a><a href="projetos.html"><i class="bi bi-house-gear-fill"></i> Projetos</a>
      <a class="active" href="clientes.html"><i class="bi bi-person-vcard-fill"></i> Clientes</a><a href="estoque.html"><i class="bi bi-box-seam-fill"></i> Estoque</a>
      <a href="equipes.html"><i class="bi bi-people-fill"></i> Equipes</a><a href="financeiro.html"><i class="bi bi-cash-stack"></i> Financeiro</a>
      <a href="relatorios.html"><i class="bi bi-bar-chart-fill"></i> Relatórios</a><a href="configuracoes.html"><i class="bi bi-gear-fill"></i> Configurações</a>
    </nav>
    <div class="sidebar-footer"><a class="icon-button text-white" href="#" id="sair"><i class="bi bi-box-arrow-right"></i> Sair</a></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main-area">
    <header class="topbar"><div class="topbar-title"><button class="menu-toggle" id="menuToggle"><i class="bi bi-list"></i></button><h1>Clientes</h1></div><div class="topbar-actions"><a class="icon-button" href="configuracoes.html" aria-label="Configurações"><i class="bi bi-gear"></i></a><div class="profile"><div class="profile-avatar"><i class="bi bi-person-fill"></i></div><div class="profile-meta"><strong id="nomeUsuario"></strong><small id="tipoUsuario"></small></div></div></div></header>
    <section class="content">
      <section class="page-hero"><div class="page-hero-copy"><h2>SUPER VOLTS<br>CLIENTES</h2><p>Acompanhe os resultados e projetos da empresa em um só lugar.</p></div></section>
      <div class="page-heading"><h2>Clientes</h2><button class="btn-primary-custom" data-bs-toggle="modal" data-bs-target="#modalCliente" id="novoCliente"><i class="bi bi-plus-lg"></i> Cadastrar cliente</button></div>
      <div class="panel mb-3"><div class="row g-2"><div class="col-md-8"><input class="form-control" id="buscaCliente" placeholder="Pesquisar por nome, documento ou e-mail"></div><div class="col-md-4"><select class="form-select" id="filtroCliente"><option value="">Todos os clientes</option><option value="comProjeto">Com projetos</option><option value="semProjeto">Sem projetos</option></select></div></div></div>
      <div class="panel"><div class="table-responsive"><table class="table"><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>E-mail</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody id="listaClientes"><tr><td colspan="6" class="empty-state">Carregando...</td></tr></tbody></table></div></div>
    </section>
  </main>
</div>
<div class="modal fade" id="modalCliente" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" id="formCliente">
  <div class="modal-header"><h5 class="modal-title">Cadastrar cliente</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input type="hidden" id="clienteId"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Nome / Razão social</label><input class="form-control" id="clienteNome" required></div>
    <div class="col-md-6"><label class="form-label">CPF / CNPJ</label><input class="form-control" id="clienteDocumento" required></div>
    <div class="col-md-6"><label class="form-label">Telefone</label><input class="form-control" id="clienteTelefone" required></div>
    <div class="col-md-6"><label class="form-label">E-mail</label><input class="form-control" type="email" id="clienteEmail" required></div>
    <div class="col-md-6"><label class="form-label">Endereço</label><input class="form-control" id="clienteEndereco" required></div>
    <div class="col-md-3"><label class="form-label">Consumo médio mensal (kWh)</label><input class="form-control" type="number" min="0" step="1" id="clienteConsumo" required></div>
    <div class="col-md-3"><label class="form-label">Tarifa de energia (R$/kWh)</label><input class="form-control" type="number" min="0" step="0.01" id="clienteTarifa" required></div>
    <div class="col-md-6"><label class="form-label">Data de cadastro</label><input class="form-control" type="date" id="clienteData" required></div>
    <div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" id="clienteObservacoes" rows="3"></textarea></div>
  </div></div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn-primary-custom">Salvar</button></div>
</form></div></div>
<div class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/auth.js?v=20261120c"></script><script src="js/clientes.js?v=20261120"></script>
</body></html>
