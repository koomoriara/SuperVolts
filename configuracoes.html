<section class="content"><section class="page-hero"><div class="page-hero-copy"><h2>SUPER VOLTS<br>CONFIGURAÇÕES</h2><p>Acompanhe os resultados e projetos da empresa em um só lugar.</p></div></section>
<div id="secaoPerfil"><div class="page-heading"><h2>Meu perfil</h2></div><div class="panel mb-4"><form id="formPerfil" class="row g-3"><input type="hidden" id="perfilId"><div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" id="perfilNome" required></div><div class="col-md-6"><label class="form-label">E-mail</label><input type="email" class="form-control" id="perfilEmail" required></div><div class="col-md-6"><label class="form-label">Nova senha</label><input type="password" class="form-control" id="perfilSenha" autocomplete="new-password"></div><div class="col-md-6"><label class="form-label">Tipo de acesso</label><input class="form-control" id="perfilTipo" readonly></div><div class="col-12"><button class="btn-primary-custom" type="submit">Salvar meu perfil</button></div></form></div></div>
<div id="secaoEmpresa"><div class="page-heading"><h2>Dados da empresa</h2></div><div class="panel mb-4"><form id="formEmpresa" class="row g-3"><div class="col-md-6"><label class="form-label">Nome da empresa</label><input class="form-control" id="empresaNome" required></div><div class="col-md-3"><label class="form-label">Telefone</label><input class="form-control" id="empresaTelefone" required></div><div class="col-md-3"><label class="form-label">E-mail</label><input type="email" class="form-control" id="empresaEmail" required></div><div class="col-12"><label class="form-label">Endereço</label><input class="form-control" id="empresaEndereco" required></div><div class="col-12"><button class="btn-primary-custom" type="submit">Salvar dados da empresa</button></div></form></div></div>
<div id="secaoUsuarios"><div class="page-heading"><h2>Usuários e permissões</h2><button class="btn-primary-custom" data-bs-toggle="modal" data-bs-target="#modalUsuario" id="novoUsuario"><i class="bi bi-plus-lg"></i> Usuário</button></div><div class="panel"><div id="listaUsuarios"></div></div></div></section></main></div>
<div class="modal fade" id="modalUsuario"><div class="modal-dialog modal-lg"><form class="modal-content" id="formUsuario"><div class="modal-header"><h5>Usuário</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="usuarioId"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" id="usuarioNome" required></div><div class="col-md-6"><label class="form-label">E-mail</label><input type="email" class="form-control" id="usuarioEmail" required></div><div class="col-md-6"><label class="form-label">Senha</label><input type="password" class="form-control" id="usuarioSenha" required></div><div class="col-md-3"><label class="form-label">Tipo</label><select class="form-select" id="usuarioTipo"><option value="gestor">Gestor</option><option value="proprietario">Proprietário</option></select></div><div class="col-md-3"><label class="form-label">Situação</label><select class="form-select" id="usuarioAtivo"><option value="true">Ativo</option><option value="false">Inativo</option></select></div><div class="col-12"><label class="form-label">Permissões</label><div id="listaPermissoes" class="d-flex flex-wrap gap-3"></div></div></div></div><div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn-primary-custom" type="submit">Salvar</button></div></form></div></div>
<div class="toast-container"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js?v=20261120c"></script><script src="js/configuracoes.js?v=20261120"></script></body></html>
